<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Delaware Orthopedic Specialists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     CONFIG — edit these two lines for your environment
     ============================================================ */
  /* Patient Forms card links to CareSense; Translator card links to
     Propio One's web app. Both are plain URL links, so both stay
     inside Kiosk Browser's locked webview rather than switching to
     a separate installed app.

     CareSense:  https://caresense.com/login
     Propio One: https://one.propio-ls.com/

     If either destination ever changes, search this file for the
     relevant href in the <a class="option ..."> tags below.
     ============================================================ */

  :root{
    --navy: #262a66;
    --navy-deep: #1b2247;
    --teal: #49c2c6;
    --teal-dark: #2f9ea3;
    --paper: #f5f6fa;
    --white: #ffffff;
    --ink: #2b2e3a;
    --ink-soft: #6b6f80;
    --line: #e2e4ee;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    width:100%;
    overflow:hidden;
    background: var(--paper);
    font-family: 'Work Sans', -apple-system, sans-serif;
    color: var(--ink);
  }

  body{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
  }

  /* ---------- Header ---------- */
  header{
    flex: 0 0 auto;
    background: var(--white);
    padding: clamp(20px, 4vh, 40px) clamp(20px, 5vw, 40px) clamp(14px, 2vh, 20px);
    text-align:center;
    position: relative;
  }

  .dos-logo{
    width: min(58%, 340px);
    height:auto;
    display:block;
    margin: 0 auto clamp(10px, 1.6vh, 16px);
  }

  .welcome-eyebrow{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-size: clamp(11px, 1.4vh, 14px);
    color: var(--teal-dark);
    margin: 0 0 6px;
  }

  .welcome-headline{
    font-family:'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: clamp(20px, 3.4vh, 30px);
    color: var(--navy);
    margin: 0;
    line-height:1.15;
  }

  .welcome-sub{
    font-size: clamp(13px, 1.8vh, 16px);
    color: var(--ink-soft);
    margin: 6px 0 0;
    font-weight:500;
  }

  /* Signature wave divider, echoing the CareSense mark */
  .wave-divider{
    display:block;
    width:100%;
    height: clamp(18px, 3vh, 28px);
    margin-top: clamp(14px, 2.2vh, 22px);
  }

  /* ---------- Main / cards ---------- */
  main{
    flex: 1 1 auto;
    display:flex;
    flex-direction:column;
    gap: clamp(16px, 2.6vh, 28px);
    padding: 0 clamp(20px, 5vw, 40px) clamp(20px, 4vh, 36px);
    min-height:0;
  }

  .option{
    flex: 1 1 0;
    display:flex;
    align-items:center;
    gap: clamp(18px, 3vw, 32px);
    border-radius: 22px;
    padding: clamp(18px, 3vh, 32px) clamp(20px, 4vw, 34px);
    border: none;
    cursor:pointer;
    text-align:left;
    text-decoration:none;
    -webkit-user-select:none;
    user-select:none;
    transition: transform .15s ease, box-shadow .15s ease;
    min-height:0;
  }

  .option:active{
    transform: scale(0.98);
  }

  /* Card 1 — Patient Forms / CareSense: light card, teal border */
  .option--forms{
    background: var(--white);
    border: 2px solid var(--line);
    box-shadow: 0 10px 24px rgba(38,42,102,0.06);
  }
  .option--forms:active{
    border-color: var(--teal);
    box-shadow: 0 4px 14px rgba(73,194,198,0.18);
  }

  /* Card 2 — Translator / ONE: solid navy card matching the ONE mark */
  .option--translate{
    background: var(--navy-deep);
    box-shadow: 0 10px 24px rgba(27,34,71,0.28);
  }
  .option--translate:active{
    box-shadow: 0 4px 14px rgba(27,34,71,0.35);
  }

  .option-icon{
    flex: 0 0 auto;
    width: clamp(64px, 12vh, 96px);
    height: clamp(64px, 12vh, 96px);
    border-radius: 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .option--forms .option-icon{
    background: var(--white);
    border: 1px solid var(--line);
  }
  .option--forms .option-icon img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 18px;
  }

  .option--translate .option-icon img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 18px;
  }

  .option-text{
    flex: 1 1 auto;
    min-width:0;
  }

  .option-kicker{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:600;
    letter-spacing:0.16em;
    text-transform:uppercase;
    font-size: clamp(10px, 1.3vh, 12.5px);
    margin: 0 0 4px;
  }
  .option--forms .option-kicker{ color: var(--teal-dark); }
  .option--translate .option-kicker{ color: var(--teal); }

  .option-title{
    font-family:'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: clamp(22px, 4vh, 34px);
    line-height:1.05;
    margin: 0 0 6px;
  }
  .option--forms .option-title{ color: var(--navy); }
  .option--translate .option-title{ color: var(--white); }

  .option-desc{
    font-size: clamp(13px, 1.7vh, 16px);
    line-height:1.35;
    margin:0;
    font-weight:500;
  }
  .option--forms .option-desc{ color: var(--ink-soft); }
  .option--translate .option-desc{ color: rgba(255,255,255,0.72); }

  .option-arrow{
    flex: 0 0 auto;
    width: clamp(30px, 4.5vh, 40px);
    height: clamp(30px, 4.5vh, 40px);
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .option--forms .option-arrow{ background: var(--paper); border: 1px solid var(--line); }
  .option--translate .option-arrow{ background: rgba(255,255,255,0.12); }
  .option-arrow svg{ width: 46%; height:46%; }

  /* ---------- Footer ---------- */
  footer{
    flex: 0 0 auto;
    text-align:center;
    padding: 0 20px clamp(14px, 2.4vh, 22px);
  }
  footer p{
    margin:0;
    font-size: clamp(10.5px, 1.3vh, 12.5px);
    color: var(--ink-soft);
    font-weight:500;
    letter-spacing:0.02em;
  }

  @media (prefers-reduced-motion: reduce){
    .option{ transition:none; }
  }
</style>
</head>
